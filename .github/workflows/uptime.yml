# Pinned deliberately. Read this before changing the version or adding a setup-node step.
#
# From 2026-06-17 to 2026-08-05 every workflow in this repo failed on every run and
# status.csnp.org went on serving a page whose data stopped that day. 49 days. Nobody
# was told, because a scheduled workflow that fails notifies nobody who was looking.
#
# The cause was upptime/uptime-monitor@v1.41.0 shipping a prebuilt node_libcurl.node
# compiled for NODE_MODULE_VERSION 115 (Node 20). GitHub now executes node20 actions
# under Node 24 (NODE_MODULE_VERSION 137), so the action aborted on require, before it
# did any work at all.
#
# The setup-node step that used to sit here pinned node-version 20 and was removed
# because it does nothing for this failure and actively misleads: it sets the Node used
# by run: steps, and there are none. The Node an action runs under comes from the
# runner and from the action own runs.using declaration, neither of which setup-node
# touches. Anyone diagnosing this again will reach for that step first, as we did.
#
# v1.43.13 is not a guess. upptime own demo repo runs it on the same hosted runners and
# was succeeding on the day this was pinned.
#
# What catches a recurrence is .github/workflows/deployment-drift.yml, which asks how
# old the data is rather than whether a run went green.

name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  # All five workflows commit to main. graphs and summary are both scheduled at 00:00, so
  # they raced by default and only GitHub's scheduler jitter kept it intermittent. Running
  # three of them together on 2026-08-06 reproduced it immediately: Response Time pushed
  # first, Summary and Graphs both died on "failed to push some refs".
  #
  # One group across every workflow in the repository, because the conflict is over one
  # branch, not one workflow. This matches what upstream generates.
  #
  # cancel-in-progress: false protects the run that is already executing. It does NOT mean
  # nothing is cancelled: GitHub allows only one PENDING run per group, so when a third
  # run joins, the one waiting is superseded. Measured on 2026-08-06, dispatching three
  # together: uptime and graphs completed, summary and site were cancelled while waiting.
  #
  # That is the deliberate trade. A cancelled run loses one cycle of data quietly and the
  # next scheduled run replaces it. A push race loses the same data AND fails red for a
  # reason that has nothing to do with the sites being monitored, which is worse to read.
  # What makes the quiet loss safe here is the drift check: it asks how old the data is,
  # so a cancellation that actually mattered would surface within 48h.
  group: ${{ github.repository }}-upptime
  cancel-in-progress: false
jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: upptime/uptime-monitor@v1.43.13
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
